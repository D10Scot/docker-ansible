repos:
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks: [{id: hadolint-docker}]
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks: [{id: actionlint}]
  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.26.1
    hooks: [{id: zizmor}]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks: [{id: gitleaks}]
