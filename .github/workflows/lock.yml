name: lock
on:
  workflow_dispatch:
  push:
    paths: ["requirements/*.in", "scripts/lock.sh", ".github/workflows/lock.yml"]
permissions: {}
jobs:
  lock:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        # Digest-pinned to the SAME base the Dockerfiles use, so the resolver sees
        # the exact Python that will run the lockfile. Keep in sync with images/*/Dockerfile:
        # Renovate bumps these and the Dockerfile FROMs together as one "base images" PR
        # (see renovate.json); if you edit one by hand, edit the other.
        include:
          - {distro: alpine, image: "alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf"}
          - {distro: debian, image: "debian:13@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6"}
          - {distro: ubuntu, image: "ubuntu:26.04@sha256:d66b366dac61b575bee2aef07e9c26e8070096fbe84a3d4d3eb0da069b5d76db"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Extract digest-pinned uv (no curl | sh)
        env:
          UV_IMAGE: ghcr.io/astral-sh/uv:0.13.7@sha256:96f40d3904aad8d0bd010539001d36c8e2188b981e1334471a90c4a1d93bb490
        run: |
          set -euo pipefail
          cid=$(docker create "$UV_IMAGE")
          docker cp "$cid:/uv" "$RUNNER_TEMP/uv"
          docker rm "$cid" >/dev/null
      - name: Compile per-arch hashed lockfiles in ${{ matrix.distro }}
        env:
          DISTRO: ${{ matrix.distro }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/w" -v "$RUNNER_TEMP/uv:/usr/local/bin/uv:ro" -w /w \
            "$IMAGE" sh /w/scripts/lock.sh "$DISTRO"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with: {name: "lock-${{ matrix.distro }}", path: "requirements/${{ matrix.distro }}-*.txt"}
