name: trivy-db-mirror
on:
  schedule: [{cron: "0 3 * * 1"}]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: oras-project/setup-oras@v1
      - name: Mirror trivy DBs into ghcr.io/d10scot
        run: |
          set -euo pipefail
          oras cp ghcr.io/aquasecurity/trivy-db:2 ghcr.io/d10scot/trivy-db:2
          oras cp ghcr.io/aquasecurity/trivy-java-db:1 ghcr.io/d10scot/trivy-java-db:1
