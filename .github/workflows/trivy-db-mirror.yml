name: trivy-db-mirror
on:
  schedule: [{cron: "0 3 * * 1"}]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mirror:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6  # v1
      - name: Mirror trivy DBs into ghcr.io/d10scot
        run: |
          set -euo pipefail
          oras cp ghcr.io/aquasecurity/trivy-db:2 ghcr.io/d10scot/trivy-db:2
          oras cp ghcr.io/aquasecurity/trivy-java-db:1 ghcr.io/d10scot/trivy-java-db:1
