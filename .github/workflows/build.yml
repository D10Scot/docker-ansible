name: build
on:
  pull_request:
    paths: ["images/**", "requirements/**", ".github/workflows/build.yml"]
  push:
    branches: [main]
    paths: ["images/**", "requirements/**", ".github/workflows/build.yml"]
permissions:
  contents: read
  security-events: write
  packages: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-scan:
    strategy:
      fail-fast: false
      matrix:
        distro: [alpine, debian, ubuntu]
        flavor: [core, full, lint]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR (for mirrored Trivy DB)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build to local OCI archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/${{ matrix.distro }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: FLAVOR=${{ matrix.flavor }}
          outputs: type=oci,dest=image.tar
          provenance: false
      - name: Trivy scan (image, mirrored DB, no upstream fetch)
        uses: aquasecurity/trivy-action@0.28.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/d10scot/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/d10scot/trivy-java-db:1
        with:
          input: image.tar
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-db-update: true
          format: sarif
          output: trivy.sarif
      - name: Grype scan (image)
        uses: anchore/scan-action@v6
        id: grype
        with:
          image: oci-archive:image.tar
          fail-build: true
          severity-cutoff: high
          output-format: sarif
          output-file: grype.sarif
      - name: pip-audit (python lockfile)
        uses: pypa/gh-action-pip-audit@v1
        with:
          inputs: requirements/${{ matrix.distro }}-${{ matrix.flavor }}-${{ matrix.arch }}.txt
      - name: OSV-Scanner (python lockfile, offline)
        uses: google/osv-scanner-action@v2
        with:
          scan-args: |-
            --lockfile=requirements/${{ matrix.distro }}-${{ matrix.flavor }}-${{ matrix.arch }}.txt
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .
          category: ${{ matrix.distro }}-${{ matrix.flavor }}-${{ matrix.arch }}
