name: build
on:
  pull_request:
    paths: ["images/**", "requirements/**", ".github/workflows/build.yml"]
  push:
    branches: [main]
    paths: ["images/**", "requirements/**", ".github/workflows/build.yml"]
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-scan:
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        distro: [alpine, debian, ubuntu]
        flavor: [core, full, lint]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - name: Authenticate to GHCR (for mirrored Trivy DB)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build to local OCI archive
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: images/${{ matrix.distro }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: FLAVOR=${{ matrix.flavor }}
          outputs: type=docker,dest=image.tar
          provenance: false
      # Policy: BLOCK the build on fixable CRITICAL OS vulns and on ANY known
      # python-dependency vuln (the python layer we fully control via the lockfile).
      # HIGH/MEDIUM OS findings are surfaced to code scanning for visibility and
      # absorbed on the weekly rebuild as distro fixes land — strict HIGH gating on
      # OS packages is unwinnable while a distro's fix is still in-flight.
      - name: Trivy report (HIGH+CRITICAL -> code scanning, non-blocking)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 (documented known-good post-compromise)
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/d10scot/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/d10scot/trivy-java-db:1
        with:
          input: image.tar
          # vuln only here. Secret scanning flags example creds in bundled ansible
          # collection source (false positives) -> gitleaks (lint.yml) covers our
          # secrets; hadolint (lint.yml) covers Dockerfile misconfig.
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: sarif
          output: trivy.sarif
      - name: Trivy gate (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 (documented known-good post-compromise)
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/d10scot/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/d10scot/trivy-java-db:1
        with:
          input: image.tar
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Grype scan (image, gate on fixable CRITICAL, report all)
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e  # v6
        id: grype
        with:
          image: docker-archive:image.tar
          fail-build: true
          only-fixed: true
          severity-cutoff: critical
          output-format: sarif
          output-file: grype.sarif
      - name: pip-audit (python lockfile, digest-pinned container)
        # Run pip-audit via a digest-pinned container with --no-deps so it audits
        # every pinned line in our already-fully-resolved lockfile WITHOUT a
        # dry-run reinstall. The pypa action force-enables require-hashes + a
        # dry-run install, which fails when the lockfile targets a newer Python
        # (Debian trixie 3.13) than the runner (3.12) and a py3.12-only transitive
        # would be required. python:3.13 covers all our lockfiles.
        env:
          LOCKFILE: requirements/${{ matrix.distro }}-${{ matrix.flavor }}-${{ matrix.arch }}.txt
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e LOCKFILE="$LOCKFILE" \
            python:3.13-slim@sha256:c33f0bc4364a6881bed1ec0cc2665e6c53c87a43e774aaeab88e6f17af105e4f \
            sh -ceu '
              pip install --no-cache-dir --quiet pip-audit==2.10.1
              pip-audit --no-deps -r "$LOCKFILE"
            '
      - name: OSV-Scanner (python lockfile, digest-pinned container)
        # Run as a digest-pinned container rather than the marketplace action:
        # the action's root action.yml lacks a runs: section, and a pinned
        # container matches the project's "pin scanners by digest" posture.
        env:
          LOCKSPEC: "requirements.txt:requirements/${{ matrix.distro }}-${{ matrix.flavor }}-${{ matrix.arch }}.txt"
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e LOCKSPEC="$LOCKSPEC" \
            ghcr.io/google/osv-scanner:v2.3.8@sha256:64e86bec6df2466feea5137fc7c78fb3b7c21ec077f014d7130f64810e50676b \
            scan source --lockfile="$LOCKSPEC"
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357  # v3
        with:
          sarif_file: .
          category: ${{ matrix.distro }}-${{ matrix.flavor }}-${{ matrix.arch }}

  # Publish only after the full scan matrix passes, and never on PRs. Each image
  # is rebuilt multi-arch from identical pinned inputs (base digest + hash-pinned
  # lockfile + same Dockerfile => reproducible), pushed by digest, signed keyless
  # with cosign, and given SBOM + SLSA build-provenance attestations.
  publish:
    needs: build-scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        distro: [alpine, debian, ubuntu]
        flavor: [core, full, lint]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da  # v3.7.0
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub (only when configured)
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compute tags
        id: meta
        env:
          DISTRO: ${{ matrix.distro }}
          FLAVOR: ${{ matrix.flavor }}
          DH_USER: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          CV=$(grep -E '^ansible-core==' "requirements/${DISTRO}-${FLAVOR}-amd64.txt" | sed -E 's/.*==([0-9]+\.[0-9]+).*/\1/')
          add() { TAGS="${TAGS:+$TAGS,}$1"; }
          TAGS=""
          add "ghcr.io/d10scot/ansible:${FLAVOR}-${DISTRO}"
          add "ghcr.io/d10scot/ansible:${CV}-${FLAVOR}-${DISTRO}"
          [ "${FLAVOR}-${DISTRO}" = "full-alpine" ] && add "ghcr.io/d10scot/ansible:latest"
          if [ -n "${DH_USER}" ]; then
            add "docker.io/d10scot/ansible:${FLAVOR}-${DISTRO}"
            add "docker.io/d10scot/ansible:${CV}-${FLAVOR}-${DISTRO}"
            [ "${FLAVOR}-${DISTRO}" = "full-alpine" ] && add "docker.io/d10scot/ansible:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - name: Build and push (multi-arch, by digest)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: images/${{ matrix.distro }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: FLAVOR=${{ matrix.flavor }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          provenance: false
      - name: cosign sign (keyless, recursive, by index digest)
        env:
          COSIGN_YES: "true"
        run: cosign sign --recursive "ghcr.io/d10scot/ansible@${{ steps.build.outputs.digest }}"
      - name: Generate SBOM (syft, SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          image: ghcr.io/d10scot/ansible@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-name: ghcr.io/d10scot/ansible
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0
        with:
          subject-name: ghcr.io/d10scot/ansible
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

  # Single run, not part of the publish matrix — keeps the Docker Hub overview/short
  # description in sync with docs/dockerhub-overview.md. Uses a plain curl call rather
  # than a third-party action to keep the release path's supply chain minimal.
  dockerhub-overview:
    needs: publish
    if: ${{ github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Sync Docker Hub overview (curl, no third-party action)
        env:
          DH_USER: ${{ vars.DOCKERHUB_USERNAME }}
          DH_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
          DH_REPO: d10scot/ansible
          SHORT_DESC: "Hardened multi-arch Ansible images: cosign-signed, SBOM + SLSA provenance. Canonical on GHCR."
        run: |
          set -euo pipefail
          # Mint a short-lived JWT. Build JSON with jq (no secrets in argv/log).
          token=$(jq -nc --arg u "$DH_USER" --arg p "$DH_PASS" '{username:$u,password:$p}' \
            | curl -fsSL -H "Content-Type: application/json" -d @- \
                https://hub.docker.com/v2/users/login/ \
            | jq -r .token)
          # PATCH overview + short description. --rawfile safely embeds the markdown.
          jq -nc --rawfile full docs/dockerhub-overview.md --arg short "$SHORT_DESC" \
              '{full_description:$full, description:$short}' \
            | curl -fsSL -X PATCH -H "Authorization: JWT ${token}" \
                -H "Content-Type: application/json" -d @- \
                "https://hub.docker.com/v2/repositories/${DH_REPO}/" \
            | jq -e '.full_description != null' >/dev/null
          echo "Docker Hub overview updated for ${DH_REPO}"
