name: build
on:
  pull_request:
    paths:
      - "images/**"
      - "requirements/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/publish.yml"
      - ".trivyignore.yaml"
      - ".grype.yaml"
      - "scripts/check-ignore-expiry.sh"
  push:
    branches: [main]
    paths:
      - "images/**"
      - "requirements/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/publish.yml"
      - ".trivyignore.yaml"
      - ".grype.yaml"
      - "scripts/check-ignore-expiry.sh"
  # Weekly rebuild: picks up OS security fixes (apk/apt upgrade at build time)
  # with no repo change. Monday 05:00 UTC, after trivy-db-mirror (Mon 03:00).
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
permissions: {}
concurrency:
  group: build-${{ github.ref }}
  # Cancel superseded PR runs only. On main, a new run must never stop a publish
  # between push and sign; it queues behind the running one instead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Exceptions to the vuln gate must carry a reason and an unexpired date. Runs
  # on every event (including the weekly schedule), because entries expire with
  # time, not with commits.
  ignore-expiry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Fail on expired or expiry-less ignore entries
        run: scripts/check-ignore-expiry.sh

  build-scan:
    needs: ignore-expiry
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        distro: [alpine, debian, ubuntu]
        flavor: [core, full, lint]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - name: Authenticate to GHCR (for mirrored Trivy DB)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build to local OCI archive
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: images/${{ matrix.distro }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: FLAVOR=${{ matrix.flavor }}
          outputs: type=docker,dest=image.tar
          provenance: false
      # Policy (AGENTS.md): BLOCK on fixable HIGH and CRITICAL findings (Trivy and
      # Grype) and on ANY known python-dependency vuln (pip-audit, OSV). Unfixed
      # OS findings are not gated (nothing to upgrade to yet). Exceptions only via the reviewed .trivyignore.yaml / .grype.yaml,
      # each with a reason and an expiry enforced by scripts/check-ignore-expiry.sh.
      # This PR-time matrix is early feedback; publish.yml re-runs the same gates
      # on the exact digest it promotes.
      - name: Trivy report (HIGH+CRITICAL -> code scanning, non-blocking)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 (documented known-good post-compromise)
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/d10scot/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/d10scot/trivy-java-db:1
        with:
          input: image.tar
          # vuln only here. Secret scanning flags example creds in bundled ansible
          # collection source (false positives) -> gitleaks (lint.yml) covers our
          # secrets; hadolint (lint.yml) covers Dockerfile misconfig.
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "0"
          format: sarif
          output: trivy.sarif
      - name: Trivy gate (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 (documented known-good post-compromise)
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/d10scot/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/d10scot/trivy-java-db:1
        with:
          input: image.tar
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          format: table
      - name: Grype scan (image, gate on fixable HIGH/CRITICAL)
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e  # v6.5.1
        id: grype
        env:
          # scan-action has no config input; grype reads GRYPE_CONFIG (ignore rules).
          GRYPE_CONFIG: .grype.yaml
        with:
          image: docker-archive:image.tar
          fail-build: true
          only-fixed: true
          severity-cutoff: high
          output-format: sarif
          output-file: grype.sarif
      - name: pip-audit (python lockfile, digest-pinned container)
        # Run pip-audit via a digest-pinned container with --no-deps so it audits
        # every pinned line in our already-fully-resolved lockfile WITHOUT a
        # dry-run reinstall. The pypa action force-enables require-hashes + a
        # dry-run install, which fails when the lockfile targets a newer Python
        # (Debian trixie 3.13) than the runner (3.12) and a py3.12-only transitive
        # would be required. python:3.13 covers all our lockfiles.
        env:
          LOCKFILE: requirements/${{ matrix.distro }}-${{ matrix.flavor }}-${{ matrix.arch }}.txt
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e LOCKFILE="$LOCKFILE" \
            python:3.13-slim@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90 \
            sh -ceu '
              pip install --no-cache-dir --quiet pip-audit==2.10.1
              pip-audit --no-deps -r "$LOCKFILE"
            '
      - name: OSV-Scanner (python lockfile, digest-pinned container)
        # Run as a digest-pinned container rather than the marketplace action:
        # the action's root action.yml lacks a runs: section, and a pinned
        # container matches the project's "pin scanners by digest" posture.
        env:
          LOCKSPEC: "requirements.txt:requirements/${{ matrix.distro }}-${{ matrix.flavor }}-${{ matrix.arch }}.txt"
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e LOCKSPEC="$LOCKSPEC" \
            ghcr.io/google/osv-scanner:v2.7.1@sha256:a70ffffc2bfd33482953e5d6b64c6fcdb30239717a07b0f0d3ab2859ce3e4cde \
            scan source --lockfile="$LOCKSPEC"
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: .
          category: ${{ matrix.distro }}-${{ matrix.flavor }}-${{ matrix.arch }}

  # Publish only from main (push, weekly schedule, or manual dispatch on main),
  # and only after the policy check and the full PR-style scan matrix pass
  # (pip-audit and OSV run only there). Each variant goes through publish.yml:
  # stage (push by digest, untagged) -> verify (scan + smoke-test that digest,
  # read-only) -> promote (sign, attest, then tag that same digest).
  # A caller job's permissions are the ceiling for the reusable workflow's jobs;
  # publish.yml narrows them per job (only `promote` gets id-token/attestations).
  publish:
    needs: [ignore-expiry, build-scan]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        distro: [alpine, debian, ubuntu]
        flavor: [core, full, lint]
    # Kept as `./` (not the 2026-07 `$/` self-repository syntax): the signer identity
    # users verify is this call's job_workflow_ref, ".../publish.yml@refs/heads/main",
    # documented for `./` calls. How `$/` (resolves to the running commit) changes
    # that claim is unverified, so switching is deferred; see docs/known-defects.md.
    uses: ./.github/workflows/publish.yml  # zizmor: ignore[self-repository]
    with:
      distro: ${{ matrix.distro }}
      flavor: ${{ matrix.flavor }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
