name: build
on:
  pull_request:
    paths: ["images/**", "requirements/**", ".github/workflows/build.yml"]
  push:
    branches: [main]
    paths: ["images/**", "requirements/**", ".github/workflows/build.yml"]
permissions:
  contents: read
  security-events: write
  packages: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-scan:
    strategy:
      fail-fast: false
      matrix:
        distro: [alpine, debian, ubuntu]
        flavor: [core, full, lint]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR (for mirrored Trivy DB)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build to local OCI archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/${{ matrix.distro }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: FLAVOR=${{ matrix.flavor }}
          outputs: type=docker,dest=image.tar
          provenance: false
      - name: Trivy scan (image, mirrored DB, no upstream fetch)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 (documented known-good post-compromise)
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/d10scot/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/d10scot/trivy-java-db:1
        with:
          input: image.tar
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-db-update: true
          format: sarif
          output: trivy.sarif
      - name: Grype scan (image)
        uses: anchore/scan-action@v6
        id: grype
        with:
          image: docker-archive:image.tar
          fail-build: true
          severity-cutoff: high
          output-format: sarif
          output-file: grype.sarif
      - name: pip-audit (python lockfile)
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements/${{ matrix.distro }}-${{ matrix.flavor }}-${{ matrix.arch }}.txt
      - name: OSV-Scanner (python lockfile, digest-pinned container)
        # Run as a digest-pinned container rather than the marketplace action:
        # the action's root action.yml lacks a runs: section, and a pinned
        # container matches the project's "pin scanners by digest" posture.
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            ghcr.io/google/osv-scanner:v2.3.8@sha256:64e86bec6df2466feea5137fc7c78fb3b7c21ec077f014d7130f64810e50676b \
            scan source --lockfile="requirements/${{ matrix.distro }}-${{ matrix.flavor }}-${{ matrix.arch }}.txt"
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .
          category: ${{ matrix.distro }}-${{ matrix.flavor }}-${{ matrix.arch }}
