---
name: Lint

on:
  pull_request:

permissions: {}

env:
  # Digest-pinned; the repo .hadolint.yaml is mounted (stdin mode never read it).
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
  RENOVATE_IMAGE: ghcr.io/renovatebot/renovate:44.222.5@sha256:8a4c49ef19bb71bedf4eaa4d1087a31a1793bd53de41478753d2d648e53eed19
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # gitleaks scans full history

      - name: hadolint — alpine
        run: docker run --rm -v "$PWD:/w:ro" -w /w "$HADOLINT_IMAGE" hadolint --config .hadolint.yaml images/alpine/Dockerfile

      - name: hadolint — debian
        run: docker run --rm -v "$PWD:/w:ro" -w /w "$HADOLINT_IMAGE" hadolint --config .hadolint.yaml images/debian/Dockerfile

      - name: hadolint — ubuntu
        run: docker run --rm -v "$PWD:/w:ro" -w /w "$HADOLINT_IMAGE" hadolint --config .hadolint.yaml images/ubuntu/Dockerfile

      - name: lockfile consistency (.in pins == lockfile pins)
        run: sh scripts/check-lock-consistency.sh

      - name: lockfile consistency checker tests
        run: sh scripts/tests/test-check-lock-consistency.sh

      # Renovate's own validator (RE2 regex engine, as in production): a config that
      # fails validation halts ALL dependency updates for the repo.
      - name: renovate config validator
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$RENOVATE_IMAGE" renovate-config-validator --strict renovate.json

      # Digest-pinned container: the rhysd/actionlint action builds from floating
      # golang:latest / alpine:latest images.
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT_IMAGE" -no-color

      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd  # v0.8.1
        with:
          # Plain output so findings FAIL the step. The default (SARIF + upload)
          # exits 0 on findings and needs security-events: write, which lint lacks.
          advanced-security: false

      - name: gitleaks (full history, digest-pinned CLI)
        # gitleaks-action needs a paid license for organisation-owned repos; the
        # CLI does not, and a pinned container also avoids a third-party action.
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" \
            git --redact --no-banner --log-opts="--all" .
